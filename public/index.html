<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            background: #e9dfc7;
            font-family: Georgia, serif;
            color: #2b2b2b;
        }
        .tiket {
            width: 420px;
            max-width: 100%;
            padding: 24px;
            background: #fbf6e9;
            border: 2px solid #2b2b2b;
            box-shadow: 6px 6px 0 #2b2b2b;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .identitas {
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            padding-bottom: 14px;
            margin-bottom: 18px;
            border-bottom: 2px dashed #2b2b2b;
        }
        .cari {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        label {
            font-family: "Courier New", monospace;
            font-size: 12px;
            letter-spacing: 2px;
        }
        input {
            flex: 1;
            padding: 8px 4px;
            font: inherit;
            border: none;
            border-bottom: 2px solid #2b2b2b;
            background: transparent;
            outline: none;
        }
        button {
            padding: 9px 14px;
            font-family: "Courier New", monospace;
            letter-spacing: 2px;
            color: #fbf6e9;
            background: #2b2b2b;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #c0392b; }
        .baris {
            display: flex;
            align-items: baseline;
            margin: 14px 0;
            font-family: "Courier New", monospace;
        }
        .nama {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .titik {
            flex: 1;
            margin: 0 8px;
            border-bottom: 2px dotted #8a8170;
        }
        .isi {
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }
        .kaki {
            margin-top: 28px;
            text-align: right;
            min-height: 44px;
        }
        .cap {
            display: inline-block;
            padding: 4px 12px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            letter-spacing: 3px;
            color: #c0392b;
            border: 3px solid #c0392b;
            transform: rotate(-6deg);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .cap.tampil { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="tiket">
        <h1>PWS Praktikum Pertemuan 3</h1>
        <div class="identitas">
            Nama: Danisha Novira Rausyanfikri<br>
            NIM: 20240140138
        </div>

        <div class="cari">
            <label for="kota">LOKASI:</label>
            <input type="text" id="kota" placeholder="ketik nama kota">
            <button onclick="cari()">CARI</button>
        </div>

        <div class="baris"><span class="nama">Negara</span><span class="titik"></span><span class="isi" id="negara">-</span></div>
        <div class="baris"><span class="nama">Provinsi</span><span class="titik"></span><span class="isi" id="provinsi">-</span></div>
        <div class="baris"><span class="nama">Kecamatan</span><span class="titik"></span><span class="isi" id="kecematan">-</span></div>
        <div class="baris"><span class="nama">Longitude</span><span class="titik"></span><span class="isi" id="longitude">-</span></div>
        <div class="baris"><span class="nama">Latitude</span><span class="titik"></span><span class="isi" id="latitude">-</span></div>

        <div class="kaki">
            <span class="cap" id="cap"></span>
        </div>
    </div>

    <script>
        function isi(id, nilai) {
            document.getElementById(id).textContent = nilai;
        }

        async function cari() {
            const kota = document.getElementById("kota").value.trim();
            const cap = document.getElementById("cap");

            if (!kota) return;

            cap.classList.remove("tampil");

            try {
                const response = await fetch("/api/lokasi?kota=" + encodeURIComponent(kota));
                const data = await response.json();

                if (!response.ok) {
                    alert(data.message);
                    return;
                }

                isi("negara", data.negara);
                isi("provinsi", data.provinsi);
                isi("kecematan", data.kecematan);
                isi("longitude", data.longitude);
                isi("latitude", data.latitude);

                cap.textContent = kota.toUpperCase();
                cap.classList.add("tampil");
            } catch (error) {
                console.error(error);
            }
        }

        document.getElementById("kota").addEventListener("keydown", function (e) {
            if (e.key === "Enter") cari();
        });
    </script>
</body>
</html>
