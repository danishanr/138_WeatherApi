<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            background: #e9dfc7;
            font-family: Georgia, serif;
            color: #2b2b2b;
        }
        .tiket {
            width: 420px;
            max-width: 100%;
            padding: 24px;
            background: #fbf6e9;
            border: 2px solid #2b2b2b;
            box-shadow: 6px 6px 0 #2b2b2b;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .identitas {
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            padding-bottom: 14px;
            margin-bottom: 18px;
            border-bottom: 2px dashed #2b2b2b;
        }
        .cari {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        label {
            font-family: "Courier New", monospace;
            font-size: 12px;
            letter-spacing: 2px;
        }
        input {
            flex: 1;
            padding: 8px 4px;
            font: inherit;
            border: none;
            border-bottom: 2px solid #2b2b2b;
            background: transparent;
            outline: none;
        }
        button {
            padding: 9px 14px;
            font-family: "Courier New", monospace;
            letter-spacing: 2px;
            color: #fbf6e9;
            background: #2b2b2b;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #c0392b; }
        .baris {
            display: flex;
            align-items: baseline;
            margin: 14px 0;
            font-family: "Courier New", monospace;
        }
        .nama {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .titik {
            flex: 1;
            margin: 0 8px;
            border-bottom: 2px dotted #8a8170;
        }
        .isi {
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }
        .kaki {
            margin-top: 28px;
            text-align: right;
            min-height: 44px;
        }
        .cap {
            display: inline-block;
            padding: 4px 12px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            letter-spacing: 3px;
            color: #c0392b;
            border: 3px solid #c0392b;
            transform: rotate(-6deg);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .cap.tampil { opacity: 0.85; }
    </style>


</head>
<body>
    <h3>PWS Praktikum Pertemuan 3</h3>
    <h3>Nama: Danisha Novira Rausyanfikri</h3>
    <h3>NIM: 20240140138</h3>

    <input type="text" id="kota" placeholder="Masukkan nama kota">
    <button onclick="cari()">Cari</button>

    <p>Negara: <span id="negara"></span></p>
    <p>Provinsi: <span id="provinsi"></span></p>
    <p>Kecematan: <span id="kecematan"></span></p>
    <p>Longitude: <span id="longitude"></span></p>
    <p>Latitude: <span id="latitude"></span></p>

    <script>
        async function cari() {
            const kota = document.getElementById("kota").value;

            try {
                const response = await fetch("/api/lokasi?kota=" + encodeURIComponent(kota));
                const data = await response.json();

                if (!response.ok) {
                    alert(data.message);
                    return;
                }

                document.getElementById("negara").innerHTML = data.negara;
                document.getElementById("provinsi").innerHTML = data.provinsi;
                document.getElementById("kecematan").innerHTML = data.kecematan;
                document.getElementById("longitude").innerHTML = data.longitude;
                document.getElementById("latitude").innerHTML = data.latitude;
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
